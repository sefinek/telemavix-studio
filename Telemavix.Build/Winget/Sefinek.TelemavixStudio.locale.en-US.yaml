ShortDescription: Add a telemetry HUD to DJI Osmo, GoPro and DJI drone footage.
Description: |-
  Requires FFmpeg 9 with shared libraries; the app offers to install it.
  Telemavix Studio adds a telemetry HUD (speed, map, route, tilt and more) to DJI Osmo, GoPro and DJI drone footage using camera telemetry, DJI flight logs and optional external GPS tracks. Videos are re-encoded with the source's codec and settings to keep the result as close to the original as possible.
